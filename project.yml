name: BruitDeNuit
options:
  bundleIdPrefix: com.bruitdenuit
  deploymentTarget:
    iOS: "16.0"
targets:
  BruitDeNuit:
    type: application
    platform: iOS
    sources: [BruitDeNuit]
    info:
      path: BruitDeNuit/Info.plist
      properties:
        CFBundleDisplayName: Bruit de Nuit
        CFBundleDevelopmentRegion: fr
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bruitdenuit.app
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
